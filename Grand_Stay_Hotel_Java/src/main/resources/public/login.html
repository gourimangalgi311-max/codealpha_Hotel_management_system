
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grand Stay Hotel</title>
    <script src="script.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #14213d, #354f70);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        .hotel-name {
            text-align: center;
            color: #b58b45;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            color: #14213d;
            margin-bottom: 20px;
        }

        .role-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-selection label {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            text-align: center;
            cursor: pointer;
        }

        .role-selection input {
            margin-right: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #b58b45;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #947039;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        .links a {
            color: #b58b45;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="hotel-name">GRAND STAY HOTEL</div>

        <h2>Welcome Back!</h2>

        <form id="loginForm">

            <div class="role-selection">
                <label>
                    <input type="radio" name="role" value="customer" checked>
                    Customer
                </label>

                <label>
                    <input type="radio" name="role" value="admin">
                    Admin
                </label>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="links">
            Don't have an account?
            <a href="register.html">Register Here</a>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const role = document.querySelector('input[name="role"]:checked').value;

            if (role === "admin") {
                alert("Admin Login Successful! Welcome to Grand Stay Hotel.");
                window.location.href = "admin.html";
            } else {
                alert("Login Successful! Welcome to Grand Stay Hotel.");
                window.location.href = "customer.html";
            }
        });
    </script>

</body>
</html>
