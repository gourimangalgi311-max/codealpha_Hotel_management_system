
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Booking | Grand Stay Hotel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .event-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .event-container h1 {
            margin-bottom: 10px;
        }

        .event-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        .event-form input,
        .event-form select,
        .event-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        .event-form textarea {
            min-height: 90px;
        }

        .event-form button {
            margin-top: 22px;
            padding: 12px 22px;
            background: #9b713c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .event-message {
            margin-top: 15px;
            color: green;
        }

        .event-types {
            margin: 20px 0;
            padding: 18px;
            background: #f5f0e9;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h2>Grand Stay Hotel</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="customer.html">Dashboard</a>
        <a href="rooms.html">Rooms</a>
    </nav>
</header>

<main class="event-container">

    <h1>Event & Venue Booking</h1>
    <p>Celebrate your special occasions with Grand Stay Hotel.</p>

    <div class="event-types">
        <h3>Our Event Facilities</h3>
        <p>Birthday Parties · Weddings · Family Functions</p>
        <p>Business Meetings · Conferences · Private Parties</p>
    </div>

    <form class="event-form" id="eventForm">

        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required>

        <label for="eventType">Select Event Type</label>
        <select id="eventType" required>
            <option value="">Choose an event</option>
            <option>Birthday Party</option>
            <option>Wedding</option>
            <option>Family Function</option>
            <option>Business Meeting</option>
            <option>Conference</option>
            <option>Private Party</option>
        </select>

        <label for="eventDate">Event Date</label>
        <input type="date" id="eventDate" required>

        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" min="1" required>

        <label for="venue">Select Venue</label>
        <select id="venue" required>
            <option value="">Choose a venue</option>
            <option>Banquet Hall</option>
            <option>Conference Hall</option>
            <option>Outdoor Event Space</option>
            <option>Private Party Hall</option>
        </select>

        <label for="requirements">Additional Requirements</label>
        <textarea id="requirements"
            placeholder="Enter decoration, food or other requirements"></textarea>

        <button type="submit">Submit Event Request</button>

        <p class="event-message" id="message"></p>

    </form>

</main>

<script>
    const eventDate = document.getElementById("eventDate");
    eventDate.min = new Date().toISOString().split("T")[0];

    document.getElementById("eventForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const eventDetails = {
            id: Date.now(),
            customerName: document.getElementById("customerName").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            eventType: document.getElementById("eventType").value,
            eventDate: document.getElementById("eventDate").value,
            guests: document.getElementById("guests").value,
            venue: document.getElementById("venue").value,
            requirements: document.getElementById("requirements").value,
            status: "Pending"
        };

        const events = JSON.parse(
            localStorage.getItem("hotelEvents") || "[]"
        );

        events.push(eventDetails);
        localStorage.setItem("hotelEvents", JSON.stringify(events));

        document.getElementById("message").textContent =
            "Your event request has been submitted successfully!";

        document.getElementById("eventForm").reset();
        eventDate.min = new Date().toISOString().split("T")[0];
    });
</script>

</body>
</html>
