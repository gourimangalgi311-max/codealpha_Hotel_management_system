
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Grand Stay Hotel</title>

    <script src="script.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #14213d, #354f70);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .hotel-name {
            text-align: center;
            color: #b58b45;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #1b2942;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #b58b45;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #b58b45;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-btn:hover {
            background: #947039;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        .login-link a {
            color: #b58b45;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        @media(max-width: 500px) {
            .register-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="hotel-name">GRAND STAY HOTEL</div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Register with us and enjoy a comfortable stay.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10}"
                       maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Create password"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="8" required>
            </div>

            <button type="submit" class="register-btn">
                Register Now
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <script>
        document.getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) {
                    alert("Passwords do not match!");
                    return;
                }

                registerSuccess();

                this.reset();
            });
    </script>

</body>
</html>
